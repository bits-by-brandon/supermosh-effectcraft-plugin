[package]
name = "supermosh-glide"
description = "Supermosh's datamosh glide as an EffectCraft effect plug-in (WebAssembly, plug-in API v1)"
version = "1.0.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/bits-by-brandon/supermosh-effectcraft-plugin"
publish = false

[lib]
# cdylib: the .wasm plug-in; rlib: native unit tests.
crate-type = ["cdylib", "rlib"]

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
panic = "abort"
codegen-units = 1
